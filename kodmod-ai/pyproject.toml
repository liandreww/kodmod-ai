[project]
name = "kodmod-ai"
version = "0.1.0"
description = "Voice-first agentic learning assistant for visually impaired students"
authors = [{ name = "KODMOD Team" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

dependencies = [
  # ---- Core orchestration
  "langgraph>=0.2.40",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langgraph-checkpoint>=1.0.0",
  "langgraph-checkpoint-postgres>=1.0.0",

  # ---- Web stack
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "PyJWT>=2.9",

  # ---- Database / cache
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis[hiredis]>=5.0",
  "pgvector>=0.3.0",

  # ---- RAG / embeddings
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2.10",
  "qdrant-client>=1.10",
  "rank-bm25>=0.2.2",
  "pypdf>=4.3",

  # ---- Voice
  "faster-whisper>=1.0.3",
  "soundfile>=0.12",
  "numpy>=1.26",

  # ---- Misc
  "httpx>=0.27",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "ipython>=8.27",
]
# Full automated test stack — see docs/testplan/. Install: pip install -e ".[test]"
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "pytest-randomly>=3.15",
  "pytest-timeout>=2.3",
  "pytest-mock>=3.14",
  "anyio>=4.4",
  "httpx>=0.27",
  "httpx-ws>=0.6",
  "respx>=0.21",
  "freezegun>=1.5",
  "schemathesis>=3.36",
  "locust>=2.31",
  "pytest-benchmark>=4.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "safety>=3.2",
  "detect-secrets>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
]
gpu = [
  "torch>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "graphs*", "tools*", "memory*", "rag*", "api*",
           "database*", "models*", "analytics*", "accessibility*",
           "prompts*", "voice*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Scratch / exploration artifacts (all untracked) — not part of the app.
extend-exclude = ["*.ipynb", "notebooks", "scripts/chat_cli.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "S"]
ignore = ["E501"]  # line length handled by formatter
# Typographic dashes / quotes and "×" appear in Indonesian copy, docstrings and
# prompts; not a real homoglyph risk here.
allowed-confusables = ["–", "—", "−", "×", "’", "‘", "“", "”"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S110", "S112", "S603", "S607", "S608", "C408", "C416", "RUF059"]  # asserts + dummy secrets + rng + best-effort swallows + docker/psql subprocess + fixed-fragment seed SQL (bound params) + dict()/unused-unpack fixture idioms
"tests/static/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]  # Stage 0 shells out to tools
"scripts/**" = ["S603", "S607", "S314"]            # subprocess in dev scripts; xml.etree parses our own CI artifacts
"api/**" = ["B008"]                                 # FastAPI Depends()/Query() in arg defaults is idiomatic
"rag/chunking.py" = ["B023"]                        # nested flush() is called synchronously within the loop iteration
"rag/stores/pgvector_store.py" = ["S608"]           # SQL assembled from fixed fragments only; all values are bound params
"docker/llm_stub/**" = ["S324"]                     # sha1 used as a non-security cache key

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -ra"
markers = [
  "static: static & build gates — no running system (Stage 0)",
  "unit: pure logic, no I/O (Stage 1)",
  "contract: schema / API / graph wiring, no I/O (Stage 2)",
  "integration: real Postgres + Redis, stubbed LLM (Stage 3)",
  "api: REST endpoints, real HTTP to the containerized api (Stage 4)",
  "ws: WebSocket /ws/voice, real WS to the containerized api (Stage 5)",
  "e2e: end-to-end user journeys, text-mode, real HTTP (Stage 6)",
  "system: black-box compose stack (Stage 7)",
  "perf: performance / load (Stage 8)",
  "security: dynamic security (Stage 9)",
  "readiness: release-readiness gate meta-checks (Stage 10) — traceability, docs, migration policy",
  "real_llm: hits a real LLM provider; skipped unless KODMOD_RUN_REAL_LLM=1",
  "slow: takes more than a few seconds",
  "db: needs Postgres",
  "redis: needs Redis",
  "known_bug: asserts TARGET behaviour of a tracked-but-unfixed bug — FAILS (red) until the bug is fixed, then goes green. Argument is the finding ref, e.g. @pytest.mark.known_bug('#12'). Staged runners select `-m \"<stage> and not known_bug\"` so a stage still gates on regressions; `make test-burndown` runs `-m known_bug` to show how many are left.",
]
