# =============================================================================
# KODMOD AI — test infra Docker Compose project  (project name: kodmod-test)
# =============================================================================
# This compose file brings up only the STATEFUL INFRA the test suite needs:
# Postgres+pgvector, Redis, and a deterministic LLM/embedding stub. None of
# these images carry application source, so they never need a rebuild when the
# code changes.
#
# The backend itself is NOT in this file. `db-init` (schema + seed) and the
# `api` server run NATIVELY ON THE HOST so a source change is picked up by a
# plain restart, no `docker build`:
#
#   Run from kodmod-ai/ :
#
#   # 1. infra
#   docker compose -p kodmod-test -f docker/docker-compose.test.yml up -d postgres redis llm-stub
#
#   # 2. schema + seed, on the host (locks the test env: DB kodmod_test, not .env's kodmod)
#   python -m scripts.init_test_db
#
#   # 3. the API, on the host (Stage 4+); run_tests.{ps1,sh} do this for you
#   python -m scripts.serve_test_api          # -> http://localhost:8000
#
#   # 4. tests, on the host
#   pip install -e ".[test]"
#   pwsh scripts/run_tests.ps1        # Windows
#   bash scripts/run_tests.sh         # bash / CI
#
#   # load (Stage 8) — needs the host api on :8000 first
#   docker compose -p kodmod-test -f docker/docker-compose.test.yml --profile load up -d locust
#
#   Reset:  docker compose -p kodmod-test -f docker/docker-compose.test.yml down -v
#
# Schema comes from scripts/create_test_db.py (extensions + ORM create_all).
# Production deploys the same models through Alembic; tests skip the chain.
#
# Manual text-mode users (docs/TEXT_MODE_TESTING.md, scripts/chat_cli.py) that
# expect DB "kodmod" on host port 5433:  override with
#   POSTGRES_DB=kodmod DB_HOST_PORT=5433 docker compose ... up -d postgres
# =============================================================================

services:
  # --------------------------------------------------------------- Postgres --
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kodmod-postgres-test
    environment:
      POSTGRES_USER: kodmod
      POSTGRES_PASSWORD: kodmod
      POSTGRES_DB: ${POSTGRES_DB:-kodmod_test}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - kodmod-pgtestdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodmod -d ${POSTGRES_DB:-kodmod_test}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ------------------------------------------------------------------ Redis --
  redis:
    image: redis:7-alpine
    container_name: kodmod-redis-test
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------- LLM stub --
  # OpenAI-compatible fake: deterministic chat completions + embeddings.
  # The host `api` talks to this (OPENAI_BASE_URL pointed at
  # http://localhost:8099/v1 by scripts/serve_test_api). Host-side pytest for
  # Stage 1/3 (no `api` involved) stubs the LLM in Python instead — tests/_fakes/.
  llm-stub:
    build:
      context: ./llm_stub
      dockerfile: Dockerfile
    container_name: kodmod-llmstub-test
    environment:
      KODMOD_STUB_EMBED_DIM: "1024"
    ports:
      - "${LLM_STUB_HOST_PORT:-8099}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------- locust --
  # Load driver (Stage 8). The `api` under test runs on the host, so target it
  # through the docker host gateway. Bring the host api up on :8000 first.
  locust:
    image: locustio/locust:2.31.8
    container_name: kodmod-locust-test
    profiles: ["load"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LOCUST_HOST_PORT:-8089}:8089"
    volumes:
      - ../tests/performance:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --host http://host.docker.internal:8000

volumes:
  kodmod-pgtestdata:
