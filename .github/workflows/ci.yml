name: CI

on:
  push:
    branches: [main, hanif]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kodmod-ai

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------ Stage 0 --
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: stage 0 — static & build gate
        # Single pytest run of `-m static` (tests/static/, spec docs/testplan/00-static.md):
        # ruff, ruff format, mypy, bandit, pip-audit, detect-secrets, import
        # smoke, settings load, compose config, marker/collection checks. The
        # runner has Docker so image-build cases (`static and slow`) run too.
        run: python -m pytest -q -m "static and not known_bug" --junitxml=reports/junit-static.xml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-static, path: kodmod-ai/reports/ }

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t kodmod-api:ci .
      - run: docker build -f docker/llm_stub/Dockerfile -t kodmod-llmstub:ci docker/llm_stub
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: kodmod-api:ci
          severity: HIGH,CRITICAL
          exit-code: "0"   # report only for now; flip to "1" for KM-READY-007

  # --------------------------------------------------------------- Stage 1-2 --
  unit-contract:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -m "(unit or contract) and not known_bug" --junitxml=reports/junit-unit-contract.xml --cov --cov-report=xml:reports/coverage-unit.xml
      - name: known-bug burndown (informational — FAIL = bug still open)
        continue-on-error: true
        run: python -m pytest -q -m "known_bug and (static or unit or contract)" -rN --junitxml=reports/junit-known-bug.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-unit-contract, path: kodmod-ai/reports/ }

  # ------------------------------------------------------------------ Stage 3 --
  # Integration talks to Python functions directly (no `api` container needed) --
  # only Postgres + Redis, provided as plain GH Actions services.
  integration:
    runs-on: ubuntu-latest
    needs: unit-contract
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: kodmod, POSTGRES_PASSWORD: kodmod, POSTGRES_DB: kodmod_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kodmod -d kodmod_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: kodmod_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      EMBEDDING_DIM: "1024"
      STT_ENABLED: "false"
      TTS_ENABLED: "false"
      JWT_SECRET: test-secret-not-for-prod-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: create test schema + seed
        run: python -m scripts.init_test_db
      - run: python -m pytest -q -m "integration and not known_bug" --junitxml=reports/junit-integration.xml --cov --cov-report=xml:reports/coverage-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-integration, path: kodmod-ai/reports/ }

  # -------------------------------------------------------------- Stage 4-6 --
  # Only the infra runs in Docker (postgres, redis, llm-stub). `db-init` and the
  # `api` server run natively on the RUNNER — schema+seed via scripts/*, the API
  # via scripts/serve_test_api — and pytest talks to it over real HTTP/WS on
  # localhost:8000. No `docker build` of the app image on this path.
  api-ws-e2e:
    runs-on: ubuntu-latest
    needs: integration
    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: kodmod_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      EMBEDDING_DIM: "1024"
      JWT_SECRET: test-secret-not-for-prod-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: bring up test infra (postgres, redis, llm-stub)
        run: docker compose -p kodmod-test -f docker/docker-compose.test.yml up -d postgres redis llm-stub
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: create test schema + seed (host)
        run: python -m scripts.init_test_db
      - name: start api (host) + wait for /live
        run: |
          mkdir -p reports
          python -m scripts.serve_test_api > reports/api.log 2>&1 &
          echo $! > reports/.api.pid
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/live && break || sleep 3; done
          curl -fsS http://localhost:8000/live
      - run: python -m pytest -q -m "(api or ws or e2e) and not known_bug" --junitxml=reports/junit-api-ws-e2e.xml
      - name: dump api log on failure
        if: failure()
        run: cat reports/api.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-api-ws-e2e, path: kodmod-ai/reports/ }
      - name: tear down
        if: always()
        run: |
          kill "$(cat reports/.api.pid)" 2>/dev/null || true
          rm -f reports/.api.pid
          docker compose -p kodmod-test -f docker/docker-compose.test.yml down -v

  # ----------------------------------------------------------------- Stage 7 --
  system:
    runs-on: ubuntu-latest
    needs: api-ws-e2e
    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: kodmod_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      EMBEDDING_DIM: "1024"
      JWT_SECRET: test-secret-not-for-prod-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: bring up test infra
        run: docker compose -p kodmod-test -f docker/docker-compose.test.yml up -d postgres redis llm-stub
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: create test schema + seed (host)
        run: python -m scripts.init_test_db
      - name: start api (host) + wait for /live
        run: |
          mkdir -p reports
          python -m scripts.serve_test_api > reports/api.log 2>&1 &
          echo $! > reports/.api.pid
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/live && break || sleep 3; done
          curl -fsS http://localhost:8000/live
      - run: python -m pytest -q -m "system and not known_bug" --junitxml=reports/junit-system.xml
      - name: dump api log on failure
        if: failure()
        run: cat reports/api.log || true
      - name: tear down
        if: always()
        run: |
          kill "$(cat reports/.api.pid)" 2>/dev/null || true
          rm -f reports/.api.pid
          docker compose -p kodmod-test -f docker/docker-compose.test.yml down -v

  # ----------------------------------------------------------------- Stage 9 --
  security:
    runs-on: ubuntu-latest
    needs: api-ws-e2e
    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: kodmod_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      EMBEDDING_DIM: "1024"
      JWT_SECRET: test-secret-not-for-prod-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: bring up test infra
        run: docker compose -p kodmod-test -f docker/docker-compose.test.yml up -d postgres redis llm-stub
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: create test schema + seed (host)
        run: python -m scripts.init_test_db
      - name: start api (host) + wait for /live
        run: |
          mkdir -p reports
          python -m scripts.serve_test_api > reports/api.log 2>&1 &
          echo $! > reports/.api.pid
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/live && break || sleep 3; done
          curl -fsS http://localhost:8000/live
      - run: python -m pytest -q -m "security and not known_bug" --junitxml=reports/junit-security.xml
      - name: dump api log on failure
        if: failure()
        run: cat reports/api.log || true
      - if: always()
        run: |
          kill "$(cat reports/.api.pid)" 2>/dev/null || true
          rm -f reports/.api.pid
          docker compose -p kodmod-test -f docker/docker-compose.test.yml down -v

  # -------------------------------------------------- Stage 8 (nightly only) --
  load:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: system
    env:
      ENV: test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: kodmod_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      EMBEDDING_DIM: "1024"
      JWT_SECRET: test-secret-not-for-prod-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: bring up test infra
        run: docker compose -p kodmod-test -f docker/docker-compose.test.yml up -d postgres redis llm-stub
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - name: create test schema + seed (host)
        run: python -m scripts.init_test_db
      - name: start api (host) + wait for /live
        run: |
          mkdir -p reports
          python -m scripts.serve_test_api > reports/api.log 2>&1 &
          echo $! > reports/.api.pid
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/live && break || sleep 3; done
          curl -fsS http://localhost:8000/live
      - name: start locust (targets host api via host.docker.internal)
        run: docker compose -p kodmod-test -f docker/docker-compose.test.yml --profile load up -d locust
      - run: python -m pytest -q -m "perf and not known_bug" --benchmark-json=docs/testplan/baselines/bench.json || true
      - uses: actions/upload-artifact@v4
        with: { name: perf-baselines, path: kodmod-ai/docs/testplan/baselines/ }
      - if: always()
        run: |
          kill "$(cat reports/.api.pid)" 2>/dev/null || true
          rm -f reports/.api.pid
          docker compose -p kodmod-test -f docker/docker-compose.test.yml down -v

  # ---------------------------------------------------------------- Stage 10 --
  # Repo-inspection meta-checks (traceability, docs, migration policy, marker
  # hygiene). No service needed. The full artefact-aggregating gate
  # (scripts/readiness_gate.py) runs from `make test-ready` on a machine that
  # has all of reports/ + docs/testplan/baselines/ from a real pipeline run.
  readiness:
    runs-on: ubuntu-latest
    needs: [unit-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -m "readiness and not known_bug" --junitxml=reports/junit-readiness.xml
      - name: known-bug burndown (informational)
        continue-on-error: true
        run: python -m pytest -q -m "known_bug and readiness" -rN
      - name: readiness gate (informational — full gate runs from make test-ready)
        continue-on-error: true
        run: python scripts/readiness_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports-readiness, path: kodmod-ai/reports/ }
